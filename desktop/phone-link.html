<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone link</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0d12; color: #f4f1ea; font: 16px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: #b8b4c8; }
  #qr { background: #fff; padding: 16px; border-radius: 16px; width: 260px; height: 260px; display: grid; place-items: center; color: #0d0d12; }
  #qr svg { width: 100%; height: 100%; }
  code { display: block; word-break: break-all; background: #1c1b26; padding: 10px 12px; border-radius: 10px; font-size: 14px; user-select: all; }
  button { background: #ff4da0; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Scan to join on your phone</h1>
  <div id="qr">Loading QR...</div>
  <code id="url"></code>
  <button id="copy">Copy link</button>
  <p>Same Wi-Fi as this laptop. If the phone warns about the certificate, tap Advanced, then Proceed.</p>
<script>
  const url = new URLSearchParams(location.search).get("url") || "";
  document.getElementById("url").textContent = url;
  try {
    const q = qrcode(0, "M"); q.addData(url); q.make();
    document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } catch { document.getElementById("qr").textContent = "QR needs internet; type the link instead."; }
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(url); document.getElementById("copy").textContent = "Copied"; } catch {}
  };
</script>
</body>
</html>
